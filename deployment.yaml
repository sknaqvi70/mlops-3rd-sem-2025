apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        env: 
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: nginx-deployment
              key: db_port
        ports:
        - containerPort: 80
